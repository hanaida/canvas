<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>학교대항전 캔버스</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
    }

    .canvas-wrapper {
      position: relative;
      display: inline-block;
    }

    canvas {
      image-rendering: pixelated;
      border: 1px solid #000;
      cursor: crosshair;
      display: block;
    }

    .hex-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }

    .hex-cell {
      position: absolute;
      font-size: 12px;
      font-weight: bold;
      line-height: 1.1;
      text-align: center;
      transform: translate(-50%, -50%);
      color: white;
      text-shadow: 0 0 2px black;
      cursor: pointer;
      user-select: none;
    }

    #fileInput,
    .modeBtn {
      font-size: 20px;
      padding: 10px 20px;
      margin: 5px;
      border: 2px solid #333;
      border-radius: 8px;
      background-color: #f0f0f0;
      cursor: pointer;
    }

    #fileInput:hover,
    .modeBtn:hover {
      background-color: #e0e0e0;
    }

    .modeBtn.active {
      background-color: #333;
      color: white;
    }

    #colorInfo {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 15px;
      font-size: 28px;
      font-weight: bold;
      background-color: #222;
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
    }

    #colorBox {
      width: 50px;
      height: 50px;
      border: 2px solid #000;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>학교대항전 캔버스</h1>

  <input
    type="file"
    id="fileInput"
    accept="image/*"
  >

  <br><br>

  <button class="modeBtn active" id="mode1Btn">
    픽셀 모드
  </button>

  <button class="modeBtn" id="mode2Btn">
    HEX 모드
  </button>

  <br><br>

  <div class="canvas-wrapper">

    <canvas
      id="canvas"
      width="1024"
      height="1024"
    ></canvas>

    <div
      class="hex-overlay"
      id="hexOverlay"
    ></div>

  </div>

  <br>

  <div id="colorInfo">

    <span id="colorBox"></span>

    <span id="colorText">
      픽셀을 클릭하면 해당 픽셀의 색상코드가 클립보드에 복사됩니다.
    </span>

  </div>

  <script>

    const fileInput =
      document.getElementById("fileInput");

    const canvas =
      document.getElementById("canvas");

    const ctx =
      canvas.getContext("2d");

    const hexOverlay =
      document.getElementById("hexOverlay");

    const colorBox =
      document.getElementById("colorBox");

    const colorText =
      document.getElementById("colorText");

    const mode1Btn =
      document.getElementById("mode1Btn");

    const mode2Btn =
      document.getElementById("mode2Btn");


    const size = 32;

    let pixelData = null;
    let currentImg = null;
    let selectedPixel = null;
    let currentMode = 1;


    const imgbbApiKey =
      "3df1cfb7a65e1f0ff0062422dc0b9ab3";


    /*
    ==========================
    이미지 선택
    ==========================
    */

    fileInput.addEventListener(
      "change",
      function(e) {

        const file =
          e.target.files[0];


        if (!file) {
          return;
        }


        /*
        ==========================
        ImgBB 업로드
        ==========================
        */

        const formData =
          new FormData();


        formData.append(
          "image",
          file
        );


        fetch(
          `https://api.imgbb.com/1/upload?key=${imgbbApiKey}`,
          {
            method: "POST",
            body: formData
          }
        )

        .then(
          res => res.json()
        )

        .then(
          data => {

            if (data.success) {

              console.log(
                "업로드 URL:",
                data.data.url
              );

            }

          }
        )

        .catch(
          err => {

            console.error(
              "업로드 실패:",
              err
            );

          }
        );


        /*
        ==========================
        이미지 불러오기
        ==========================
        */

        const img =
          new Image();


        const objectUrl =
          URL.createObjectURL(file);


        img.src =
          objectUrl;


        img.onload = function() {

          currentImg =
            img;


          const tempCanvas =
            document.createElement(
              "canvas"
            );


          tempCanvas.width =
            size;

          tempCanvas.height =
            size;


          const tctx =
            tempCanvas.getContext(
              "2d"
            );


          tctx.imageSmoothingEnabled =
            false;


          tctx.drawImage(
            img,
            0,
            0,
            size,
            size
          );


          pixelData =
            tctx.getImageData(
              0,
              0,
              size,
              size
            ).data;


          selectedPixel =
            null;


          drawMainCanvas();


          URL.revokeObjectURL(
            objectUrl
          );

        };

      }
    );


    /*
    ==========================
    RGB -> HEX
    ==========================
    */

    function rgbToHex(
      r,
      g,
      b
    ) {

      return (
        "#" +
        [r, g, b]

          .map(
            value =>
              value
                .toString(16)
                .padStart(
                  2,
                  "0"
                )
          )

          .join("")

          .toUpperCase()
      );

    }


    /*
    ==========================
    클립보드 복사
    ==========================
    */

    async function copyToClipboard(
      text
    ) {

      try {

        await navigator.clipboard.writeText(
          text
        );

        return true;

      }

      catch (error) {

        console.error(
          "클립보드 복사 실패:",
          error
        );


        /*
        대체 복사 방식
        */

        try {

          const textarea =
            document.createElement(
              "textarea"
            );


          textarea.value =
            text;


          textarea.style.position =
            "fixed";

          textarea.style.left =
            "-9999px";

          textarea.style.top =
            "-9999px";


          document.body.appendChild(
            textarea
          );


          textarea.focus();

          textarea.select();


          const success =
            document.execCommand(
              "copy"
            );


          document.body.removeChild(
            textarea
          );


          return success;

        }

        catch (
          fallbackError
        ) {

          console.error(
            "대체 복사 실패:",
            fallbackError
          );


          return false;

        }

      }

    }


    /*
    ==========================
    메인 캔버스 그리기
    ==========================
    */

    function drawMainCanvas() {

      if (
        !currentImg ||
        !pixelData
      ) {
        return;
      }


      const tempCanvas =
        document.createElement(
          "canvas"
        );


      tempCanvas.width =
        size;

      tempCanvas.height =
        size;


      const tctx =
        tempCanvas.getContext(
          "2d"
        );


      tctx.imageSmoothingEnabled =
        false;


      tctx.drawImage(
        currentImg,
        0,
        0,
        size,
        size
      );


      ctx.imageSmoothingEnabled =
        false;


      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.drawImage(
        tempCanvas,
        0,
        0,
        canvas.width,
        canvas.height
      );


      hexOverlay.innerHTML =
        "";


      /*
      ==========================
      픽셀 모드 선택 테두리
      ==========================
      */

      if (
        currentMode === 1 &&
        selectedPixel
      ) {

        const scale =
          canvas.width /
          size;


        ctx.strokeStyle =
          "red";


        ctx.lineWidth =
          4;


        ctx.strokeRect(
          selectedPixel.x * scale,
          selectedPixel.y * scale,
          scale,
          scale
        );

      }


      /*
      ==========================
      HEX 모드
      ==========================
      */

      if (
        currentMode === 2
      ) {

        drawAllHexOverlay();

      }

    }


    /*
    ==========================
    HEX 코드 전체 표시
    ==========================
    */

    function drawAllHexOverlay() {

      const scale =
        canvas.width /
        size;


      for (
        let y = 0;
        y < size;
        y++
      ) {

        for (
          let x = 0;
          x < size;
          x++
        ) {

          const idx =
            (
              y *
              size +
              x
            ) * 4;


          const r =
            pixelData[idx];

          const g =
            pixelData[idx + 1];

          const b =
            pixelData[idx + 2];


          const hex =
            rgbToHex(
              r,
              g,
              b
            );


          const codeWithoutHash =
            hex.substring(1);


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "hex-cell";


          /*
          화면에는 # 포함 표시
          */

          div.innerHTML =
            hex.slice(0, 4) +
            "<br>" +
            hex.slice(4);


          div.style.left =
            `${(x + 0.5) * scale}px`;


          div.style.top =
            `${(y + 0.5) * scale}px`;


          div.style.width =
            `${scale}px`;


          div.style.height =
            `${scale}px`;


          div.style.display =
            "flex";


          div.style.alignItems =
            "center";


          div.style.justifyContent =
            "center";


          div.style.boxSizing =
            "border-box";


          const brightness =
            (
              r * 0.299 +
              g * 0.587 +
              b * 0.114
            );


          div.style.color =
            brightness > 128
              ? "black"
              : "white";


          /*
          ==========================
          HEX 모드 클릭
          ==========================
          */

          div.addEventListener(
            "click",
            async function(e) {

              e.stopPropagation();


              const copied =
                await copyToClipboard(
                  codeWithoutHash
                );


              colorBox.style.backgroundColor =
                hex;


              /*
              좌표는 1 ~ 32 기준
              */

              const displayX =
                x + 1;


              const displayY =
                y + 1;


              if (copied) {

                colorText.textContent =
                  `(${displayX}, ${displayY}) → ${codeWithoutHash} 복사 완료!`;

              }

              else {

                colorText.textContent =
                  `(${displayX}, ${displayY}) → 복사 실패`;

              }

            }
          );


          hexOverlay.appendChild(
            div
          );

        }

      }

    }


    /*
    ==========================
    픽셀 모드 클릭
    ==========================
    */

    canvas.addEventListener(
      "click",
      async function(e) {

        if (
          !pixelData ||
          currentMode !== 1
        ) {
          return;
        }


        const rect =
          canvas.getBoundingClientRect();


        const scaleX =
          canvas.width /
          rect.width;


        const scaleY =
          canvas.height /
          rect.height;


        const mouseX =
          (
            e.clientX -
            rect.left
          ) * scaleX;


        const mouseY =
          (
            e.clientY -
            rect.top
          ) * scaleY;


        const pixelX =
          Math.floor(
            mouseX /
            (
              canvas.width /
              size
            )
          );


        const pixelY =
          Math.floor(
            mouseY /
            (
              canvas.height /
              size
            )
          );


        if (
          pixelX < 0 ||
          pixelX >= size ||
          pixelY < 0 ||
          pixelY >= size
        ) {
          return;
        }


        const idx =
          (
            pixelY *
            size +
            pixelX
          ) * 4;


        const r =
          pixelData[idx];

        const g =
          pixelData[idx + 1];

        const b =
          pixelData[idx + 2];


        const hex =
          rgbToHex(
            r,
            g,
            b
          );


        /*
        # 제거
        */

        const codeWithoutHash =
          hex.substring(1);


        /*
        클립보드 복사
        */

        const copied =
          await copyToClipboard(
            codeWithoutHash
          );


        /*
        색상 박스
        */

        colorBox.style.backgroundColor =
          hex;


        /*
        선택 픽셀 저장
        내부 좌표는 0 ~ 31 유지
        */

        selectedPixel = {
          x: pixelX,
          y: pixelY
        };


        /*
        선택 테두리 그리기
        */

        drawMainCanvas();


        /*
        화면에 표시할 좌표는
        1 ~ 32
        */

        const displayX =
          pixelX + 1;


        const displayY =
          pixelY + 1;


        if (copied) {

          colorText.textContent =
            `(${displayX}, ${displayY}) → ${codeWithoutHash} 복사 완료!`;

        }

        else {

          colorText.textContent =
            `(${displayX}, ${displayY}) → 복사 실패`;

        }

      }
    );


    /*
    ==========================
    모드 버튼 상태
    ==========================
    */

    function updateModeButtons() {

      mode1Btn.classList.remove(
        "active"
      );


      mode2Btn.classList.remove(
        "active"
      );


      if (
        currentMode === 1
      ) {

        mode1Btn.classList.add(
          "active"
        );

      }


      if (
        currentMode === 2
      ) {

        mode2Btn.classList.add(
          "active"
        );

      }

    }


    /*
    ==========================
    픽셀 모드
    ==========================
    */

    mode1Btn.addEventListener(
      "click",
      () => {

        currentMode =
          1;


        /*
        HEX 오버레이가
        클릭을 막지 않도록 함
        */

        hexOverlay.style.pointerEvents =
          "none";


        colorText.textContent =
          "픽셀을 클릭하면 해당 픽셀의 색상코드가 클립보드에 복사됩니다.";


        updateModeButtons();


        drawMainCanvas();

      }
    );


    /*
    ==========================
    HEX 모드
    ==========================
    */

    mode2Btn.addEventListener(
      "click",
      () => {

        currentMode =
          2;


        selectedPixel =
          null;


        /*
        HEX 셀 클릭 활성화
        */

        hexOverlay.style.pointerEvents =
          "auto";


        colorText.textContent =
          "픽셀을 클릭하면 해당 픽셀의 색상코드가 클립보드에 복사됩니다.";


        updateModeButtons();


        drawMainCanvas();

      }
    );


    /*
    ==========================
    최초 상태
    ==========================
    */

    hexOverlay.style.pointerEvents =
      "none";


    updateModeButtons();

  </script>

</body>
  </html>
