<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>학교대항전 캔버스</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0D1117;

      --panel: #161B22;
      --panel-2: #1C2128;
      --panel-3: #22272E;

      --border: #30363D;
      --border-light: #444C56;

      --text: #F0F6FC;
      --text-sub: #8B949E;

      --accent: #58A6FF;
      --accent-hover: #79C0FF;

      --success: #3FB950;
      --danger: #F85149;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Pretendard,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #161B22 0%,
          #0D1117 50%
        );

      color: var(--text);
    }

    .app {
      width: min(
        1120px,
        calc(100% - 32px)
      );

      margin: 0 auto;

      padding:
        32px
        0
        60px;
    }

    /* =========================
       상단 제목
       ========================= */

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 24px;
    }

    .header-title h1 {
      margin: 0;

      font-size: 30px;
      font-weight: 800;

      letter-spacing: -1px;
    }

    .header-title p {
      margin: 7px 0 0;

      color: var(--text-sub);

      font-size: 14px;
    }

    .size-badge {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding: 7px 11px;

      border:
        1px solid
        var(--border);

      border-radius: 999px;

      background:
        rgba(
          255,
          255,
          255,
          0.04
        );

      color: var(--text-sub);

      font-size: 13px;
      font-weight: 700;

      white-space: nowrap;
    }

    /* =========================
       상단 툴바
       ========================= */

    .toolbar {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 14px;

      padding: 12px;

      margin-bottom: 16px;

      border:
        1px solid
        var(--border);

      border-radius: 14px;

      background:
        rgba(
          22,
          27,
          34,
          0.88
        );

      backdrop-filter:
        blur(14px);

      box-shadow:
        0 12px 40px
        rgba(
          0,
          0,
          0,
          0.22
        );
    }

    .toolbar-left {
      display: flex;

      align-items: center;

      gap: 10px;
    }

    /* =========================
       이미지 선택
       ========================= */

    #fileInput {
      display: none;
    }

    .upload-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      min-height: 44px;

      padding:
        0
        16px;

      border:
        1px solid
        var(--border-light);

      border-radius: 10px;

      background:
        var(--panel-3);

      color: var(--text);

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease;
    }

    .upload-button:hover {
      background: #2D333B;

      border-color: #6E7681;
    }

    .upload-button:active {
      transform: scale(0.98);
    }

    .upload-icon {
      font-size: 18px;
    }

    /* =========================
       ImgBB 상태
       ========================= */

    #uploadStatus {
      display: inline-flex;

      align-items: center;

      gap: 6px;

      color: var(--text-sub);

      font-size: 13px;

      white-space: nowrap;
    }

    #uploadStatus.success {
      color: var(--success);
    }

    #uploadStatus.error {
      color: var(--danger);
    }

    /* =========================
       작업 공간
       ========================= */

    .workspace {
      border:
        1px solid
        var(--border);

      border-radius: 18px;

      background:
        rgba(
          22,
          27,
          34,
          0.75
        );

      overflow: hidden;

      box-shadow:
        0 20px 70px
        rgba(
          0,
          0,
          0,
          0.3
        );
    }

    /* =========================
       작업 공간 헤더
       ========================= */

    .workspace-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 16px;

      min-height: 48px;

      padding:
        0
        16px;

      border-bottom:
        1px solid
        var(--border);

      background:
        rgba(
          28,
          33,
          40,
          0.92
        );
    }

    .workspace-title {
      display: flex;

      align-items: center;

      gap: 9px;

      color: var(--text-sub);

      font-size: 13px;
      font-weight: 700;
    }

    .status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background:
        var(--success);

      box-shadow:
        0 0 10px
        rgba(
          63,
          185,
          80,
          0.7
        );
    }

    .pixel-badge {
      padding: 5px 9px;

      border:
        1px solid
        var(--border);

      border-radius: 7px;

      background:
        #0D1117;

      color:
        var(--text-sub);

      font-size: 11px;
      font-weight: 800;
    }

    /* =========================
       캔버스 영역
       ========================= */

    .canvas-area {
      display: flex;

      align-items: center;
      justify-content: center;

      padding: 26px;

      overflow: auto;

      background-color:
        #080B10;

      background-image:
        radial-gradient(
          rgba(
            255,
            255,
            255,
            0.055
          )
          1px,
          transparent
          1px
        );

      background-size:
        18px
        18px;
    }

    .canvas-wrapper {
      position: relative;

      display: inline-block;

      line-height: 0;

      border:
        1px solid
        #4B5563;

      border-radius: 7px;

      overflow: hidden;

      background:
        #FFFFFF;

      box-shadow:
        0 18px 50px
        rgba(
          0,
          0,
          0,
          0.5
        );
    }

    canvas {
      display: block;

      width:
        min(
          850px,
          calc(100vw - 100px)
        );

      height: auto;

      image-rendering:
        pixelated;

      cursor:
        crosshair;

      background:
        white;

      touch-action:
        manipulation;
    }

    /* =========================
       이전 / 다음 버튼
       ========================= */

    .navigation-bar {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 12px;

      padding:
        14px
        16px;

      border-top:
        1px solid
        var(--border);

      background:
        var(--panel-2);
    }

    .navBtn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 145px;
      min-height: 44px;

      padding:
        0
        18px;

      border:
        1px solid
        var(--border-light);

      border-radius:
        10px;

      background:
        var(--panel-3);

      color:
        var(--text);

      font-size:
        14px;
      font-weight:
        800;

      cursor:
        pointer;

      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.1s ease,
        opacity 0.15s ease;
    }

    .navBtn:hover:not(:disabled) {
      background:
        #2D333B;

      border-color:
        var(--accent);
    }

    .navBtn:active:not(:disabled) {
      transform:
        scale(0.97);
    }

    .navBtn:disabled {
      opacity:
        0.35;

      cursor:
        not-allowed;
    }

    #nextBtn:not(:disabled) {
      border-color:
        rgba(
          88,
          166,
          255,
          0.55
        );
    }

    /* =========================
       하단 상태
       ========================= */

    .info-bar {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 16px;

      padding:
        14px
        16px;

      border-top:
        1px solid
        var(--border);

      background:
        var(--panel);
    }

    .color-result {
      display: flex;

      align-items: center;

      gap: 12px;

      min-width: 0;
    }

    #colorBox {
      width: 38px;
      height: 38px;

      flex-shrink: 0;

      border:
        2px solid
        rgba(
          255,
          255,
          255,
          0.18
        );

      border-radius: 9px;

      background:
        #2D333B;

      box-shadow:
        inset 0 0 0 1px
        rgba(
          0,
          0,
          0,
          0.4
        );
    }

    .result-text-area {
      min-width: 0;
    }

    .result-label {
      margin-bottom: 3px;

      color:
        var(--text-sub);

      font-size: 11px;
      font-weight: 800;

      text-transform:
        uppercase;

      letter-spacing:
        0.7px;
    }

    #colorText {
      color:
        var(--text);

      font-size: 15px;
      font-weight: 700;

      word-break:
        keep-all;
    }

    #colorText.success {
      color:
        #7EE787;
    }

    #colorText.error {
      color:
        #FF7B72;
    }

    .hint {
      color:
        var(--text-sub);

      font-size: 12px;

      white-space:
        nowrap;
    }

    /* =========================
       복사 애니메이션
       ========================= */

    @keyframes copyFlash {
      0% {
        transform:
          scale(1);
      }

      35% {
        transform:
          scale(1.08);
      }

      100% {
        transform:
          scale(1);
      }
    }

    #colorBox.flash {
      animation:
        copyFlash
        0.25s
        ease;
    }

    /* =========================
       모바일
       ========================= */

    @media (
      max-width: 760px
    ) {

      .app {
        width:
          calc(
            100% - 20px
          );

        padding-top:
          18px;
      }

      .header {
        align-items:
          flex-start;

        margin-bottom:
          16px;
      }

      .header-title h1 {
        font-size:
          24px;
      }

      .header-title p {
        font-size:
          12px;
      }

      .toolbar {
        align-items:
          stretch;
      }

      .toolbar-left {
        width:
          100%;
      }

      .upload-button {
        flex:
          1;
      }

      .canvas-area {
        padding:
          10px;
      }

      canvas {
        width:
          calc(
            100vw - 42px
          );
      }

      .navigation-bar {
        gap:
          8px;

        padding:
          10px;
      }

      .navBtn {
        flex:
          1;

        min-width:
          0;

        padding:
          0 8px;

        font-size:
          13px;
      }

      .info-bar {
        align-items:
          flex-start;

        flex-direction:
          column;
      }

      #colorText {
        font-size:
          13px;
      }

      .hint {
        display:
          none;
      }

    }

  </style>
</head>


<body>

  <main class="app">

    <!-- =========================
         제목
         ========================= -->

    <header class="header">

      <div class="header-title">

        <h1>
          학교대항전 캔버스
        </h1>

        <p>
          원하는 픽셀을 클릭하거나 이전·다음 버튼으로 이동해 색상코드를 복사하세요.
        </p>

      </div>


      <div class="size-badge">
        32 × 32
      </div>

    </header>


    <!-- =========================
         이미지 선택
         ========================= -->

    <section class="toolbar">

      <div class="toolbar-left">

        <input
          type="file"
          id="fileInput"
          accept="image/*"
        >


        <label
          for="fileInput"
          class="upload-button"
        >

          <span class="upload-icon">
            ＋
          </span>

          이미지 선택

        </label>


        <span id="uploadStatus">
          이미지 없음
        </span>

      </div>

    </section>


    <!-- =========================
         작업 공간
         ========================= -->

    <section class="workspace">


      <div class="workspace-header">

        <div class="workspace-title">

          <span class="status-dot"></span>

          PIXEL CANVAS

        </div>


        <span class="pixel-badge">
          32 × 32 PIXEL
        </span>

      </div>


      <!-- 캔버스 -->

      <div class="canvas-area">

        <div class="canvas-wrapper">

          <canvas
            id="canvas"
            width="1024"
            height="1024"
          ></canvas>

        </div>

      </div>


      <!-- =========================
           이전 / 다음
           ========================= -->

      <div class="navigation-bar">

        <button
          id="prevBtn"
          class="navBtn"
          disabled
        >
          ← 이전 픽셀
        </button>


        <button
          id="nextBtn"
          class="navBtn"
          disabled
        >
          다음 픽셀 →
        </button>

      </div>


      <!-- =========================
           결과
           ========================= -->

      <div class="info-bar">

        <div class="color-result">

          <span id="colorBox"></span>


          <div class="result-text-area">

            <div class="result-label">
              Clipboard
            </div>


            <div id="colorText">
              이미지를 선택한 뒤 픽셀을 클릭하세요.
            </div>

          </div>

        </div>


        <div class="hint">
          클릭하면 # 없이 복사
        </div>

      </div>

    </section>

  </main>


  <script>

    /* =========================
       요소
       ========================= */

    const fileInput =
      document.getElementById(
        "fileInput"
      );


    const canvas =
      document.getElementById(
        "canvas"
      );


    const ctx =
      canvas.getContext(
        "2d"
      );


    const colorBox =
      document.getElementById(
        "colorBox"
      );


    const colorText =
      document.getElementById(
        "colorText"
      );


    const uploadStatus =
      document.getElementById(
        "uploadStatus"
      );


    const prevBtn =
      document.getElementById(
        "prevBtn"
      );


    const nextBtn =
      document.getElementById(
        "nextBtn"
      );


    /* =========================
       설정
       ========================= */

    const size =
      32;


    const totalPixels =
      size * size;


    let pixelData =
      null;


    let currentImg =
      null;


    let selectedPixel =
      null;


    const imgbbApiKey =
      "3df1cfb7a65e1f0ff0062422dc0b9ab3";


    /* =========================
       이미지 선택
       ========================= */

    fileInput.addEventListener(
      "change",
      function(e) {

        const file =
          e.target.files[0];


        if (!file) {
          return;
        }


        uploadStatus.className =
          "";


        uploadStatus.textContent =
          "업로드 중...";


        /* =========================
           ImgBB 업로드
           ========================= */

        const formData =
          new FormData();


        formData.append(
          "image",
          file
        );


        fetch(
          `https://api.imgbb.com/1/upload?key=${imgbbApiKey}`,
          {
            method:
              "POST",

            body:
              formData
          }
        )

        .then(
          response =>
            response.json()
        )

        .then(
          data => {

            if (
              data.success
            ) {

              console.log(
                "ImgBB 업로드 URL:",
                data.data.url
              );


              uploadStatus.className =
                "success";


              uploadStatus.textContent =
                "● ImgBB 업로드 완료";

            }

            else {

              uploadStatus.className =
                "error";


              uploadStatus.textContent =
                "● ImgBB 업로드 실패";

            }

          }
        )

        .catch(
          error => {

            console.error(
              "ImgBB 업로드 실패:",
              error
            );


            uploadStatus.className =
              "error";


            uploadStatus.textContent =
              "● ImgBB 업로드 실패";

          }
        );


        /* =========================
           로컬 이미지 로드
           ========================= */

        const img =
          new Image();


        const objectUrl =
          URL.createObjectURL(
            file
          );


        img.src =
          objectUrl;


        img.onload =
          function() {

            currentImg =
              img;


            const tempCanvas =
              document.createElement(
                "canvas"
              );


            tempCanvas.width =
              size;


            tempCanvas.height =
              size;


            const tempCtx =
              tempCanvas.getContext(
                "2d"
              );


            tempCtx.imageSmoothingEnabled =
              false;


            tempCtx.drawImage(
              img,
              0,
              0,
              size,
              size
            );


            pixelData =
              tempCtx.getImageData(
                0,
                0,
                size,
                size
              ).data;


            selectedPixel =
              null;


            updateNavigationButtons();


            colorText.className =
              "";


            colorText.textContent =
              "픽셀을 클릭하면 해당 색상코드가 복사됩니다.";


            drawMainCanvas();


            URL.revokeObjectURL(
              objectUrl
            );

          };

      }
    );


    /* =========================
       RGB → HEX
       ========================= */

    function rgbToHex(
      r,
      g,
      b
    ) {

      return (
        "#" +
        [r, g, b]

          .map(
            value =>
              value
                .toString(16)
                .padStart(
                  2,
                  "0"
                )
          )

          .join("")

          .toUpperCase()
      );

    }


    /* =========================
       클립보드 복사
       ========================= */

    async function copyToClipboard(
      text
    ) {

      if (
        navigator.clipboard &&
        window.isSecureContext
      ) {

        try {

          await navigator.clipboard.writeText(
            text
          );


          return true;

        }

        catch (
          error
        ) {

          console.warn(
            "Clipboard API 실패:",
            error
          );

        }

      }


      try {

        const textarea =
          document.createElement(
            "textarea"
          );


        textarea.value =
          text;


        textarea.setAttribute(
          "readonly",
          ""
        );


        textarea.style.position =
          "fixed";


        textarea.style.left =
          "-9999px";


        textarea.style.top =
          "-9999px";


        document.body.appendChild(
          textarea
        );


        textarea.focus();


        textarea.select();


        textarea.setSelectionRange(
          0,
          text.length
        );


        const success =
          document.execCommand(
            "copy"
          );


        document.body.removeChild(
          textarea
        );


        return success;

      }

      catch (
        error
      ) {

        console.error(
          "클립보드 복사 실패:",
          error
        );


        return false;

      }

    }


    /* =========================
       캔버스 그리기
       ========================= */

    function drawMainCanvas() {

      if (
        !currentImg ||
        !pixelData
      ) {

        return;

      }


      const tempCanvas =
        document.createElement(
          "canvas"
        );


      tempCanvas.width =
        size;


      tempCanvas.height =
        size;


      const tempCtx =
        tempCanvas.getContext(
          "2d"
        );


      tempCtx.imageSmoothingEnabled =
        false;


      tempCtx.drawImage(
        currentImg,
        0,
        0,
        size,
        size
      );


      ctx.imageSmoothingEnabled =
        false;


      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.drawImage(
        tempCanvas,
        0,
        0,
        canvas.width,
        canvas.height
      );


      /* =========================
         선택 픽셀 테두리
         ========================= */

      if (
        selectedPixel
      ) {

        const cellWidth =
          canvas.width /
          size;


        const cellHeight =
          canvas.height /
          size;


        /*
        검은 외곽선
        */

        ctx.strokeStyle =
          "rgba(0, 0, 0, 0.9)";


        ctx.lineWidth =
          8;


        ctx.strokeRect(
          selectedPixel.x *
          cellWidth,

          selectedPixel.y *
          cellHeight,

          cellWidth,

          cellHeight
        );


        /*
        파란 테두리
        */

        ctx.strokeStyle =
          "#58A6FF";


        ctx.lineWidth =
          4;


        ctx.strokeRect(
          selectedPixel.x *
          cellWidth,

          selectedPixel.y *
          cellHeight,

          cellWidth,

          cellHeight
        );

      }

    }


    /* =========================
       현재 선택된 픽셀 번호
       0 ~ 1023
       ========================= */

    function getSelectedIndex() {

      if (
        !selectedPixel
      ) {

        return -1;

      }


      return (
        selectedPixel.y *
        size +
        selectedPixel.x
      );

    }


    /* =========================
       이전 / 다음 버튼 상태
       ========================= */

    function updateNavigationButtons() {

      if (
        !pixelData ||
        !selectedPixel
      ) {

        prevBtn.disabled =
          true;


        nextBtn.disabled =
          true;


        return;

      }


      const index =
        getSelectedIndex();


      prevBtn.disabled =
        index <= 0;


      nextBtn.disabled =
        index >=
        totalPixels - 1;

    }


    /* =========================
       픽셀 선택 + 복사
       ========================= */

    async function copyPixel(
      pixelX,
      pixelY
    ) {

      if (
        !pixelData
      ) {

        return;

      }


      if (
        pixelX < 0 ||
        pixelX >= size ||
        pixelY < 0 ||
        pixelY >= size
      ) {

        return;

      }


      const idx =
        (
          pixelY *
          size +
          pixelX
        ) * 4;


      const r =
        pixelData[
          idx
        ];


      const g =
        pixelData[
          idx + 1
        ];


      const b =
        pixelData[
          idx + 2
        ];


      const hex =
        rgbToHex(
          r,
          g,
          b
        );


      /*
      # 제거
      */

      const codeWithoutHash =
        hex.substring(
          1
        );


      /*
      클립보드 복사
      */

      const copied =
        await copyToClipboard(
          codeWithoutHash
        );


      /*
      선택 픽셀 저장
      */

      selectedPixel = {

        x:
          pixelX,

        y:
          pixelY

      };


      /*
      색상 표시
      */

      colorBox.style.backgroundColor =
        hex;


      colorBox.classList.remove(
        "flash"
      );


      void colorBox.offsetWidth;


      colorBox.classList.add(
        "flash"
      );


      /*
      테두리 업데이트
      */

      drawMainCanvas();


      /*
      이전 / 다음 버튼 상태
      */

      updateNavigationButtons();


      /*
      화면 좌표
      */

      const displayX =
        pixelX + 1;


      const displayY =
        pixelY + 1;


      if (
        copied
      ) {

        colorText.className =
          "success";


        colorText.textContent =
          `(${displayX}, ${displayY}) → ${codeWithoutHash} 복사 완료!`;

      }

      else {

        colorText.className =
          "error";


        colorText.textContent =
          `(${displayX}, ${displayY}) → 복사 실패`;

      }

    }


    /* =========================
       index로 픽셀 선택
       ========================= */

    async function copyPixelByIndex(
      index
    ) {

      if (
        index < 0 ||
        index >= totalPixels
      ) {

        return;

      }


      const pixelX =
        index %
        size;


      const pixelY =
        Math.floor(
          index /
          size
        );


      await copyPixel(
        pixelX,
        pixelY
      );

    }


    /* =========================
       캔버스 클릭
       ========================= */

    canvas.addEventListener(
      "click",
      async function(e) {

        if (
          !pixelData
        ) {

          colorText.className =
            "error";


          colorText.textContent =
            "먼저 이미지를 선택해주세요.";


          return;

        }


        const rect =
          canvas.getBoundingClientRect();


        const relativeX =
          (
            e.clientX -
            rect.left
          ) /
          rect.width;


        const relativeY =
          (
            e.clientY -
            rect.top
          ) /
          rect.height;


        const pixelX =
          Math.floor(
            relativeX *
            size
          );


        const pixelY =
          Math.floor(
            relativeY *
            size
          );


        await copyPixel(
          pixelX,
          pixelY
        );

      }
    );


    /* =========================
       이전 픽셀
       ========================= */

    prevBtn.addEventListener(
      "click",
      async function() {

        const currentIndex =
          getSelectedIndex();


        if (
          currentIndex <= 0
        ) {

          return;

        }


        await copyPixelByIndex(
          currentIndex - 1
        );

      }
    );


    /* =========================
       다음 픽셀
       ========================= */

    nextBtn.addEventListener(
      "click",
      async function() {

        const currentIndex =
          getSelectedIndex();


        if (
          currentIndex < 0 ||
          currentIndex >=
          totalPixels - 1
        ) {

          return;

        }


        await copyPixelByIndex(
          currentIndex + 1
        );

      }
    );


    /*
    최초 버튼 상태
    */

    updateNavigationButtons();

  </script>

</body>
      </html>
