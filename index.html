<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>학교대항전 캔버스</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0D1117;
      --panel: #161B22;
      --panel-2: #1C2128;
      --panel-3: #22272E;

      --border: #30363D;
      --border-light: #444C56;

      --text: #F0F6FC;
      --text-sub: #8B949E;

      --accent: #58A6FF;
      --accent-hover: #79C0FF;

      --success: #3FB950;
      --danger: #F85149;

      --radius: 14px;
    }


    body {
      margin: 0;

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Pretendard,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #161B22 0%,
          #0D1117 50%
        );

      color: var(--text);
    }


    /*
    ==========================
    전체 페이지
    ==========================
    */

    .app {
      width: min(
        1120px,
        calc(100% - 32px)
      );

      margin: 0 auto;

      padding:
        32px
        0
        60px;
    }


    /*
    ==========================
    상단 제목
    ==========================
    */

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 24px;
    }


    .header-title h1 {
      margin: 0;

      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
    }


    .header-title p {
      margin:
        7px
        0
        0;

      color: var(--text-sub);

      font-size: 14px;
    }


    .size-badge {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding:
        7px
        11px;

      border:
        1px solid
        var(--border);

      border-radius: 999px;

      background:
        rgba(
          255,
          255,
          255,
          0.04
        );

      color: var(--text-sub);

      font-size: 13px;
      font-weight: 700;

      white-space: nowrap;
    }


    /*
    ==========================
    툴바
    ==========================
    */

    .toolbar {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 14px;

      padding: 12px;

      margin-bottom: 16px;

      border:
        1px solid
        var(--border);

      border-radius:
        var(--radius);

      background:
        rgba(
          22,
          27,
          34,
          0.88
        );

      backdrop-filter:
        blur(14px);

      box-shadow:
        0
        12px
        40px
        rgba(
          0,
          0,
          0,
          0.22
        );
    }


    .toolbar-left,
    .toolbar-right {
      display: flex;

      align-items: center;

      gap: 10px;
    }


    /*
    ==========================
    파일 선택
    ==========================
    */

    #fileInput {
      display: none;
    }


    .upload-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      min-height: 44px;

      padding:
        0
        16px;

      border:
        1px solid
        var(--border-light);

      border-radius: 10px;

      background:
        var(--panel-3);

      color:
        var(--text);

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease;
    }


    .upload-button:hover {
      background: #2D333B;

      border-color:
        #6E7681;
    }


    .upload-button:active {
      transform:
        scale(0.98);
    }


    .upload-icon {
      font-size: 18px;
    }


    /*
    ==========================
    업로드 상태
    ==========================
    */

    #uploadStatus {
      display: inline-flex;

      align-items: center;

      gap: 6px;

      color:
        var(--text-sub);

      font-size: 13px;

      white-space: nowrap;
    }


    #uploadStatus.success {
      color:
        var(--success);
    }


    #uploadStatus.error {
      color:
        var(--danger);
    }


    /*
    ==========================
    모드 선택
    ==========================
    */

    .mode-switch {
      display: flex;

      gap: 4px;

      padding: 4px;

      border:
        1px solid
        var(--border);

      border-radius: 11px;

      background:
        #0D1117;
    }


    .modeBtn {
      min-height: 36px;

      padding:
        0
        15px;

      border: none;

      border-radius: 8px;

      background:
        transparent;

      color:
        var(--text-sub);

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.15s ease,
        color 0.15s ease;
    }


    .modeBtn:hover {
      color:
        var(--text);
    }


    .modeBtn.active {
      background:
        var(--panel-3);

      color:
        var(--text);

      box-shadow:
        0
        2px
        6px
        rgba(
          0,
          0,
          0,
          0.35
        );
    }


    /*
    ==========================
    메인 작업 영역
    ==========================
    */

    .workspace {
      border:
        1px solid
        var(--border);

      border-radius:
        18px;

      background:
        rgba(
          22,
          27,
          34,
          0.75
        );

      overflow: hidden;

      box-shadow:
        0
        20px
        70px
        rgba(
          0,
          0,
          0,
          0.3
        );
    }


    /*
    ==========================
    작업 영역 상단
    ==========================
    */

    .workspace-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 16px;

      min-height: 48px;

      padding:
        0
        16px;

      border-bottom:
        1px solid
        var(--border);

      background:
        rgba(
          28,
          33,
          40,
          0.92
        );
    }


    .workspace-title {
      display: flex;

      align-items: center;

      gap: 9px;

      color:
        var(--text-sub);

      font-size: 13px;
      font-weight: 700;
    }


    .status-dot {
      width: 8px;
      height: 8px;

      border-radius:
        50%;

      background:
        var(--success);

      box-shadow:
        0
        0
        10px
        rgba(
          63,
          185,
          80,
          0.7
        );
    }


    #modeLabel {
      padding:
        5px
        9px;

      border:
        1px solid
        var(--border);

      border-radius: 7px;

      background:
        #0D1117;

      color:
        var(--text-sub);

      font-size: 11px;
      font-weight: 800;
    }


    /*
    ==========================
    캔버스 영역
    ==========================
    */

    .canvas-area {
      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        26px;

      overflow: auto;

      background-color:
        #080B10;

      background-image:
        radial-gradient(
          rgba(
            255,
            255,
            255,
            0.055
          )
          1px,
          transparent
          1px
        );

      background-size:
        18px
        18px;
    }


    .canvas-wrapper {
      position: relative;

      display: inline-block;

      line-height: 0;

      border:
        1px solid
        #4B5563;

      border-radius:
        7px;

      overflow: hidden;

      background:
        #FFFFFF;

      box-shadow:
        0
        18px
        50px
        rgba(
          0,
          0,
          0,
          0.5
        );
    }


    canvas {
      display: block;

      width:
        min(
          850px,
          calc(100vw - 100px)
        );

      height: auto;

      image-rendering:
        pixelated;

      cursor:
        crosshair;

      background:
        white;

      touch-action:
        manipulation;
    }


    /*
    ==========================
    HEX 오버레이
    ==========================
    */

    .hex-overlay {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;
    }


    .hex-cell {
      position: absolute;

      display: flex;

      align-items: center;
      justify-content: center;

      transform:
        translate(
          -50%,
          -50%
        );

      font-size: 12px;
      font-weight: 800;
      line-height: 1.05;

      text-align: center;

      user-select: none;

      text-shadow:
        0
        1px
        2px
        rgba(
          0,
          0,
          0,
          0.8
        );
    }


    /*
    ==========================
    하단 상태바
    ==========================
    */

    .info-bar {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 16px;

      padding:
        14px
        16px;

      border-top:
        1px solid
        var(--border);

      background:
        var(--panel);
    }


    .color-result {
      display: flex;

      align-items: center;

      gap: 12px;

      min-width: 0;
    }


    #colorBox {
      width: 38px;
      height: 38px;

      flex-shrink: 0;

      border:
        2px solid
        rgba(
          255,
          255,
          255,
          0.18
        );

      border-radius: 9px;

      background:
        #2D333B;

      box-shadow:
        inset
        0
        0
        0
        1px
        rgba(
          0,
          0,
          0,
          0.4
        );
    }


    .result-text-area {
      min-width: 0;
    }


    .result-label {
      margin-bottom: 3px;

      color:
        var(--text-sub);

      font-size: 11px;
      font-weight: 800;

      text-transform:
        uppercase;

      letter-spacing:
        0.7px;
    }


    #colorText {
      color:
        var(--text);

      font-size: 15px;
      font-weight: 700;

      word-break:
        keep-all;
    }


    #colorText.success {
      color:
        #7EE787;
    }


    #colorText.error {
      color:
        #FF7B72;
    }


    .hint {
      color:
        var(--text-sub);

      font-size: 12px;

      white-space:
        nowrap;
    }


    /*
    ==========================
    복사 성공 애니메이션
    ==========================
    */

    @keyframes copyFlash {

      0% {
        transform:
          scale(1);
      }

      35% {
        transform:
          scale(1.08);
      }

      100% {
        transform:
          scale(1);
      }

    }


    #colorBox.flash {
      animation:
        copyFlash
        0.25s
        ease;
    }


    /*
    ==========================
    모바일
    ==========================
    */

    @media (
      max-width: 760px
    ) {

      .app {
        width:
          calc(
            100% - 20px
          );

        padding-top:
          18px;
      }


      .header {
        align-items:
          flex-start;

        margin-bottom:
          16px;
      }


      .header-title h1 {
        font-size:
          24px;
      }


      .header-title p {
        font-size:
          12px;
      }


      .toolbar {
        flex-direction:
          column;

        align-items:
          stretch;
      }


      .toolbar-left,
      .toolbar-right {
        width:
          100%;
      }


      .upload-button {
        flex:
          1;
      }


      .mode-switch {
        width:
          100%;
      }


      .modeBtn {
        flex:
          1;
      }


      .canvas-area {
        padding:
          10px;
      }


      canvas {
        width:
          calc(
            100vw - 42px
          );
      }


      .info-bar {
        align-items:
          flex-start;

        flex-direction:
          column;
      }


      #colorText {
        font-size:
          13px;
      }


      .hint {
        display:
          none;
      }

    }
  </style>
</head>


<body>

  <main class="app">


    <!-- =========================
         상단 제목
         ========================= -->

    <header class="header">

      <div class="header-title">

        <h1>
          학교대항전 캔버스
        </h1>

        <p>
          이미지를 32×32 픽셀로 변환하고 색상코드를 빠르게 복사하세요.
        </p>

      </div>


      <div class="size-badge">
        32 × 32
      </div>

    </header>


    <!-- =========================
         툴바
         ========================= -->

    <section class="toolbar">

      <div class="toolbar-left">

        <input
          type="file"
          id="fileInput"
          accept="image/*"
        >


        <label
          for="fileInput"
          class="upload-button"
        >

          <span class="upload-icon">
            ＋
          </span>

          이미지 선택

        </label>


        <span id="uploadStatus">
          이미지 없음
        </span>

      </div>


      <div class="toolbar-right">

        <div class="mode-switch">

          <button
            class="modeBtn active"
            id="mode1Btn"
          >
            픽셀
          </button>


          <button
            class="modeBtn"
            id="mode2Btn"
          >
            HEX
          </button>

        </div>

      </div>

    </section>


    <!-- =========================
         작업 공간
         ========================= -->

    <section class="workspace">


      <div class="workspace-header">

        <div class="workspace-title">

          <span class="status-dot"></span>

          CANVAS

        </div>


        <span id="modeLabel">
          PIXEL MODE
        </span>

      </div>


      <!-- 캔버스 -->

      <div class="canvas-area">

        <div
          class="canvas-wrapper"
          id="canvasWrapper"
        >

          <canvas
            id="canvas"
            width="1024"
            height="1024"
          ></canvas>


          <div
            class="hex-overlay"
            id="hexOverlay"
          ></div>

        </div>

      </div>


      <!-- =========================
           결과 상태바
           ========================= -->

      <div class="info-bar">

        <div class="color-result">

          <span id="colorBox"></span>


          <div class="result-text-area">

            <div class="result-label">
              Clipboard
            </div>


            <div id="colorText">
              이미지를 선택한 뒤 픽셀을 클릭하세요.
            </div>

          </div>

        </div>


        <div class="hint">
          클릭하면 # 없이 복사
        </div>

      </div>

    </section>

  </main>


  <script>

    /*
    ==========================
    요소
    ==========================
    */

    const fileInput =
      document.getElementById(
        "fileInput"
      );


    const canvas =
      document.getElementById(
        "canvas"
      );


    const ctx =
      canvas.getContext(
        "2d"
      );


    const canvasWrapper =
      document.getElementById(
        "canvasWrapper"
      );


    const hexOverlay =
      document.getElementById(
        "hexOverlay"
      );


    const colorBox =
      document.getElementById(
        "colorBox"
      );


    const colorText =
      document.getElementById(
        "colorText"
      );


    const mode1Btn =
      document.getElementById(
        "mode1Btn"
      );


    const mode2Btn =
      document.getElementById(
        "mode2Btn"
      );


    const modeLabel =
      document.getElementById(
        "modeLabel"
      );


    const uploadStatus =
      document.getElementById(
        "uploadStatus"
      );


    /*
    ==========================
    기본 설정
    ==========================
    */

    const size =
      32;


    let pixelData =
      null;


    let currentImg =
      null;


    let selectedPixel =
      null;


    let currentMode =
      1;


    const imgbbApiKey =
      "3df1cfb7a65e1f0ff0062422dc0b9ab3";


    /*
    ==========================
    이미지 선택
    ==========================
    */

    fileInput.addEventListener(
      "change",
      function(e) {

        const file =
          e.target.files[0];


        if (!file) {
          return;
        }


        uploadStatus.className =
          "";


        uploadStatus.textContent =
          "업로드 중...";


        /*
        ==========================
        ImgBB 업로드
        ==========================
        */

        const formData =
          new FormData();


        formData.append(
          "image",
          file
        );


        fetch(
          `https://api.imgbb.com/1/upload?key=${imgbbApiKey}`,
          {
            method:
              "POST",

            body:
              formData
          }
        )

        .then(
          res =>
            res.json()
        )

        .then(
          data => {

            if (
              data.success
            ) {

              console.log(
                "업로드 URL:",
                data.data.url
              );


              uploadStatus.className =
                "success";


              uploadStatus.textContent =
                "● ImgBB 업로드 완료";

            }

            else {

              uploadStatus.className =
                "error";


              uploadStatus.textContent =
                "● 업로드 실패";

            }

          }
        )

        .catch(
          err => {

            console.error(
              "업로드 실패:",
              err
            );


            uploadStatus.className =
              "error";


            uploadStatus.textContent =
              "● 업로드 실패";

          }
        );


        /*
        ==========================
        로컬 이미지 로드
        ==========================
        */

        const img =
          new Image();


        const objectUrl =
          URL.createObjectURL(
            file
          );


        img.src =
          objectUrl;


        img.onload =
          function() {


            currentImg =
              img;


            const tempCanvas =
              document.createElement(
                "canvas"
              );


            tempCanvas.width =
              size;


            tempCanvas.height =
              size;


            const tctx =
              tempCanvas.getContext(
                "2d"
              );


            tctx.imageSmoothingEnabled =
              false;


            /*
            32 x 32로 축소
            */

            tctx.drawImage(
              img,
              0,
              0,
              size,
              size
            );


            pixelData =
              tctx.getImageData(
                0,
                0,
                size,
                size
              ).data;


            selectedPixel =
              null;


            colorText.className =
              "";


            colorText.textContent =
              "픽셀을 클릭하면 색상코드가 복사됩니다.";


            drawMainCanvas();


            URL.revokeObjectURL(
              objectUrl
            );

          };

      }
    );


    /*
    ==========================
    RGB → HEX
    ==========================
    */

    function rgbToHex(
      r,
      g,
      b
    ) {

      return (
        "#" +
        [r, g, b]

          .map(
            value =>
              value
                .toString(16)
                .padStart(
                  2,
                  "0"
                )
          )

          .join("")

          .toUpperCase()
      );

    }


    /*
    ==========================
    클립보드 복사
    ==========================
    */

    async function copyToClipboard(
      text
    ) {

      /*
      Clipboard API
      */

      if (
        navigator.clipboard &&
        window.isSecureContext
      ) {

        try {

          await navigator.clipboard.writeText(
            text
          );


          return true;

        }

        catch (
          error
        ) {

          console.warn(
            "Clipboard API 실패:",
            error
          );

        }

      }


      /*
      대체 방식
      */

      try {

        const textarea =
          document.createElement(
            "textarea"
          );


        textarea.value =
          text;


        textarea.setAttribute(
          "readonly",
          ""
        );


        textarea.style.position =
          "fixed";


        textarea.style.left =
          "-9999px";


        textarea.style.top =
          "-9999px";


        document.body.appendChild(
          textarea
        );


        textarea.focus();


        textarea.select();


        textarea.setSelectionRange(
          0,
          text.length
        );


        const success =
          document.execCommand(
            "copy"
          );


        document.body.removeChild(
          textarea
        );


        return success;

      }

      catch (
        error
      ) {

        console.error(
          "클립보드 복사 실패:",
          error
        );


        return false;

      }

    }


    /*
    ==========================
    메인 캔버스
    ==========================
    */

    function drawMainCanvas() {

      if (
        !currentImg ||
        !pixelData
      ) {

        return;

      }


      const tempCanvas =
        document.createElement(
          "canvas"
        );


      tempCanvas.width =
        size;


      tempCanvas.height =
        size;


      const tctx =
        tempCanvas.getContext(
          "2d"
        );


      tctx.imageSmoothingEnabled =
        false;


      tctx.drawImage(
        currentImg,
        0,
        0,
        size,
        size
      );


      ctx.imageSmoothingEnabled =
        false;


      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.drawImage(
        tempCanvas,
        0,
        0,
        canvas.width,
        canvas.height
      );


      hexOverlay.innerHTML =
        "";


      /*
      픽셀 모드 선택 테두리
      */

      if (
        currentMode === 1 &&
        selectedPixel
      ) {

        const cellWidth =
          canvas.width /
          size;


        const cellHeight =
          canvas.height /
          size;


        /*
        바깥쪽 검은색 테두리
        */

        ctx.strokeStyle =
          "rgba(0,0,0,0.8)";


        ctx.lineWidth =
          8;


        ctx.strokeRect(

          selectedPixel.x *
          cellWidth,

          selectedPixel.y *
          cellHeight,

          cellWidth,

          cellHeight

        );


        /*
        안쪽 밝은 테두리
        */

        ctx.strokeStyle =
          "#58A6FF";


        ctx.lineWidth =
          4;


        ctx.strokeRect(

          selectedPixel.x *
          cellWidth,

          selectedPixel.y *
          cellHeight,

          cellWidth,

          cellHeight

        );

      }


      /*
      HEX 모드
      */

      if (
        currentMode === 2
      ) {

        drawAllHexOverlay();

      }

    }


    /*
    ==========================
    HEX 오버레이
    ==========================
    */

    function drawAllHexOverlay() {

      if (
        !pixelData
      ) {

        return;

      }


      const overlayWidth =
        hexOverlay.clientWidth;


      const overlayHeight =
        hexOverlay.clientHeight;


      const cellWidth =
        overlayWidth /
        size;


      const cellHeight =
        overlayHeight /
        size;


      for (
        let y = 0;
        y < size;
        y++
      ) {

        for (
          let x = 0;
          x < size;
          x++
        ) {

          const idx =
            (
              y *
              size +
              x
            ) * 4;


          const r =
            pixelData[
              idx
            ];


          const g =
            pixelData[
              idx + 1
            ];


          const b =
            pixelData[
              idx + 2
            ];


          const hex =
            rgbToHex(
              r,
              g,
              b
            );


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "hex-cell";


          div.innerHTML =
            hex.slice(
              0,
              4
            ) +
            "<br>" +
            hex.slice(
              4
            );


          div.style.left =
            `${(x + 0.5) * cellWidth}px`;


          div.style.top =
            `${(y + 0.5) * cellHeight}px`;


          div.style.width =
            `${cellWidth}px`;


          div.style.height =
            `${cellHeight}px`;


          const fontSize =
            Math.max(
              5,
              Math.min(
                12,
                cellWidth * 0.38
              )
            );


          div.style.fontSize =
            `${fontSize}px`;


          const brightness =
            (
              r * 0.299 +
              g * 0.587 +
              b * 0.114
            );


          /*
          밝은 색에서는 검은 글자
          어두운 색에서는 흰 글자
          */

          if (
            brightness > 150
          ) {

            div.style.color =
              "#111827";


            div.style.textShadow =
              "0 1px 1px rgba(255,255,255,0.5)";

          }

          else {

            div.style.color =
              "#FFFFFF";


            div.style.textShadow =
              "0 1px 2px rgba(0,0,0,0.9)";

          }


          hexOverlay.appendChild(
            div
          );

        }

      }

    }


    /*
    ==========================
    색상 복사
    ==========================
    */

    async function copyPixel(
      pixelX,
      pixelY
    ) {

      if (
        !pixelData
      ) {

        return;

      }


      if (
        pixelX < 0 ||
        pixelX >= size ||
        pixelY < 0 ||
        pixelY >= size
      ) {

        return;

      }


      const idx =
        (
          pixelY *
          size +
          pixelX
        ) * 4;


      const r =
        pixelData[
          idx
        ];


      const g =
        pixelData[
          idx + 1
        ];


      const b =
        pixelData[
          idx + 2
        ];


      const hex =
        rgbToHex(
          r,
          g,
          b
        );


      /*
      # 제거
      */

      const codeWithoutHash =
        hex.substring(
          1
        );


      const copied =
        await copyToClipboard(
          codeWithoutHash
        );


      colorBox.style.backgroundColor =
        hex;


      /*
      복사 성공 애니메이션
      */

      colorBox.classList.remove(
        "flash"
      );


      void colorBox.offsetWidth;


      colorBox.classList.add(
        "flash"
      );


      /*
      픽셀 모드 선택 표시
      */

      if (
        currentMode === 1
      ) {

        selectedPixel = {
          x:
            pixelX,

          y:
            pixelY
        };


        drawMainCanvas();

      }


      /*
      화면 좌표는 1 ~ 32
      */

      const displayX =
        pixelX + 1;


      const displayY =
        pixelY + 1;


      if (
        copied
      ) {

        colorText.className =
          "success";


        colorText.textContent =
          `(${displayX}, ${displayY}) → ${codeWithoutHash} 복사 완료!`;

      }

      else {

        colorText.className =
          "error";


        colorText.textContent =
          `(${displayX}, ${displayY}) → 복사 실패`;

      }

    }


    /*
    ==========================
    캔버스 클릭
    두 모드 공통
    ==========================
    */

    canvas.addEventListener(
      "click",
      async function(e) {

        if (
          !pixelData
        ) {

          colorText.className =
            "error";


          colorText.textContent =
            "먼저 이미지를 선택해주세요.";


          return;

        }


        const rect =
          canvas.getBoundingClientRect();


        const relativeX =
          (
            e.clientX -
            rect.left
          ) /
          rect.width;


        const relativeY =
          (
            e.clientY -
            rect.top
          ) /
          rect.height;


        const pixelX =
          Math.floor(
            relativeX *
            size
          );


        const pixelY =
          Math.floor(
            relativeY *
            size
          );


        await copyPixel(
          pixelX,
          pixelY
        );

      }
    );


    /*
    ==========================
    모드 버튼 UI
    ==========================
    */

    function updateModeButtons() {

      mode1Btn.classList.remove(
        "active"
      );


      mode2Btn.classList.remove(
        "active"
      );


      if (
        currentMode === 1
      ) {

        mode1Btn.classList.add(
          "active"
        );


        modeLabel.textContent =
          "PIXEL MODE";

      }


      if (
        currentMode === 2
      ) {

        mode2Btn.classList.add(
          "active"
        );


        modeLabel.textContent =
          "HEX MODE";

      }

    }


    /*
    ==========================
    픽셀 모드
    ==========================
    */

    mode1Btn.addEventListener(
      "click",
      function() {

        currentMode =
          1;


        colorText.className =
          "";


        colorText.textContent =
          "픽셀을 클릭하면 해당 색상코드가 복사됩니다.";


        updateModeButtons();


        drawMainCanvas();

      }
    );


    /*
    ==========================
    HEX 모드
    ==========================
    */

    mode2Btn.addEventListener(
      "click",
      function() {

        currentMode =
          2;


        selectedPixel =
          null;


        colorText.className =
          "";


        colorText.textContent =
          "HEX가 표시된 픽셀을 클릭하면 색상코드가 복사됩니다.";


        updateModeButtons();


        drawMainCanvas();

      }
    );


    /*
    ==========================
    창 크기 변경 시
    HEX 위치 다시 계산
    ==========================
    */

    window.addEventListener(
      "resize",
      function() {

        if (
          currentMode === 2 &&
          pixelData
        ) {

          drawMainCanvas();

        }

      }
    );


    /*
    ==========================
    최초 UI
    ==========================
    */

    updateModeButtons();

  </script>

</body>
  </html>
